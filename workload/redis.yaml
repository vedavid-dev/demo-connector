apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      containers:
        - name: redis
          image: redis:7-bookworm
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.92.0
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: workload
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
      name: redis
