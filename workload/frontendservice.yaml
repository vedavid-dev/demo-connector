apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontendservice
  namespace: workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontendservice
  template:
    metadata:
      labels:
        app: frontendservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: frontendservice
          image: ghcr.io/caulagi/rust-k8s-demo/frontendservice:sha-d7775a3
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: QUOTATION_SERVICE_HOSTNAME
              value: quotationservice
            - name: RUST_LOG
              value: frontend_server=info
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontendservice
  namespace: workload
spec:
  selector:
    app: frontendservice
  ports:
    - port: 80
      targetPort: http
      name: http
