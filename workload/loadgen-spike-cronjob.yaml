# A visible spike every few hours, so the app shows something happening at a random time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loadgen-spike
  namespace: workload
spec:
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: spike
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  end=$(($(date +%s) + 60))
                  while [ "$(date +%s)" -lt "$end" ]; do
                    for _ in $(seq 1 60); do
                      curl -s -o /dev/null -m 3 "http://frontendservice.workload.svc.cluster.local/" &
                    done
                    wait
                  done
              # Sixty curls run at once, each a few megabytes.
              resources:
                requests: { cpu: 20m, memory: 128Mi }
                limits: { memory: 384Mi }
