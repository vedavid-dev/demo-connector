# The sine period is ~5 minutes, so a 1-hour view already shows shape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-script
  namespace: workload
data:
  loadgen.sh: |
    #!/bin/sh
    set -eu

    url="http://frontendservice.workload.svc.cluster.local/"

    hit() {
      # Best-effort: a slow or erroring backend must not stall the loop.
      curl -s -o /dev/null -m 3 "$1" || true
    }

    while true; do
      now=$(date +%s)
      # Between 10 and 30 requests a second over the cycle.
      count=$(awk -v t="$now" 'BEGIN { printf "%d", 20 * (1 + 0.5 * sin(t / 300)) }')
      n=0
      while [ "$n" -lt "$count" ]; do
        hit "$url" &
        n=$((n + 1))
      done
      wait
      sleep 1
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/scripts/loadgen.sh"]
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: loadgen-script
            defaultMode: 0555
