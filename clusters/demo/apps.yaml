apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: vedavid-demo
  # The new frontends call the quotation service in the workload namespace.
  dependsOn:
    - name: workload
  wait: true
  timeout: 5m
