apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vedavid-demo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/vedavid-dev/demo-connector
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vedavid-demo
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: vedavid-demo
