apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: emojivoto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-bot
  template:
    metadata:
      labels:
        app: vote-bot
    spec:
      containers:
        - name: vote-bot
          image: ghcr.io/buoyantio/emojivoto-web:v11
          command: ["emojivoto-vote-bot"]
          env:
            - name: WEB_HOST
              value: web-svc.emojivoto:80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 48Mi }
