# A third HTTP service with its own cache beside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogservice
  namespace: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogservice
  template:
    metadata:
      labels:
        app: catalogservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: catalogservice
          image: ghcr.io/caulagi/rust-k8s-demo/frontendservice:sha-ca68573
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: QUOTATION_SERVICE_HOSTNAME
              value: quotationservice.workload.svc.cluster.local
            - name: RUST_LOG
              value: frontend_server=info
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 30m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalogservice
  namespace: catalog
spec:
  selector:
    app: catalogservice
  ports:
    - port: 80
      targetPort: http
      name: http
