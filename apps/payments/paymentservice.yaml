# A second team's HTTP service, in its own namespace, calling the quotation
# service across the cluster. Its metrics carry app=paymentservice and
# namespace=payments, so questions by service and by namespace have more
# than one answer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: paymentservice
          image: ghcr.io/caulagi/rust-k8s-demo/frontendservice:sha-ca68573
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: QUOTATION_SERVICE_HOSTNAME
              value: quotationservice.workload.svc.cluster.local
            - name: RUST_LOG
              value: frontend_server=info
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 30m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: payments
spec:
  selector:
    app: paymentservice
  ports:
    - port: 80
      targetPort: http
      name: http
