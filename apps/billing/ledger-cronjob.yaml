# Writes and reads a ledger every five minutes, so the database has
# transactions, tuples and query time worth graphing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ledger
  namespace: billing
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ledger
              image: postgres:16-bookworm
              env:
                - name: PGHOST
                  value: postgres.billing.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: billing
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: password
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  psql -v ON_ERROR_STOP=1 <<'SQL'
                  CREATE TABLE IF NOT EXISTS ledger (
                    id bigserial PRIMARY KEY,
                    account int NOT NULL,
                    amount_cents int NOT NULL,
                    posted_at timestamptz NOT NULL DEFAULT now()
                  );
                  INSERT INTO ledger (account, amount_cents)
                  SELECT (random() * 500)::int, (random() * 20000 - 10000)::int
                  FROM generate_series(1, 2000);
                  SELECT account, sum(amount_cents) FROM ledger GROUP BY account ORDER BY 2 DESC LIMIT 10;
                  DELETE FROM ledger WHERE posted_at < now() - interval '1 day';
                  SQL
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
