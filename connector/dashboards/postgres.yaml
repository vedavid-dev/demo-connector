version: 1
id: postgres
title: Postgres

sections:
  - title: Health
    elements:
      - type: stat
        title: Connections used
        description: Client backends across all databases, as a share of max_connections.
        query: >-
          100 * sum(pg_stat_database_numbackends{namespace="workload", job="kubernetes-pods"})
          / max(pg_settings_max_connections{namespace="workload", job="kubernetes-pods"})
        unit: percent
        decimals: 0
        thresholds:
          direction: above
          steps:
            - { at: 70, level: warning }
            - { at: 90, level: critical }

      - type: stat
        title: Longest transaction
        description: Age of the oldest open transaction. Long ones hold locks and block vacuum.
        query: max(pg_stat_activity_max_tx_duration{namespace="workload", job="kubernetes-pods"}) or vector(0)
        unit: seconds
        decimals: 0
        thresholds:
          direction: above
          steps:
            - { at: 60, level: warning }
            - { at: 300, level: critical }

      - type: stat
        title: Idle in transaction
        description: Sessions that opened a transaction and stopped issuing queries.
        query: sum(pg_stat_activity_count{namespace="workload", job="kubernetes-pods", state=~"idle in transaction.*"}) or vector(0)
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 3, level: warning }
            - { at: 10, level: critical }

      - type: stat
        title: Deadlocks (1h)
        query: round(sum(increase(pg_stat_database_deadlocks{namespace="workload", job="kubernetes-pods"}[1h]))) or vector(0)
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }

      - type: stat
        title: Database size
        query: sum(pg_database_size_bytes{namespace="workload", job="kubernetes-pods", datname="postgres"})
        unit: bytes

  - title: Activity
    elements:
      - type: line
        title: Query latency
        description: Measured by the quotation service around each query, so it includes the network hop.
        query: >-
          label_replace(histogram_quantile(0.5, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "quantile", "p50", "", "")
          or
          label_replace(histogram_quantile(0.95, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "quantile", "p95", "", "")
          or
          label_replace(histogram_quantile(0.99, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "quantile", "p99", "", "")
        unit: milliseconds
        series:
          label: "{{quantile}}"

      - type: line
        title: Rows by operation
        query: >-
          label_replace(sum(rate(pg_stat_database_tup_fetched{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])), "op", "fetched", "", "")
          or
          label_replace(sum(rate(pg_stat_database_tup_inserted{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])), "op", "inserted", "", "")
          or
          label_replace(sum(rate(pg_stat_database_tup_updated{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])), "op", "updated", "", "")
          or
          label_replace(sum(rate(pg_stat_database_tup_deleted{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])), "op", "deleted", "", "")
        unit: ops_per_sec
        series:
          label: "{{op}}"

      - type: line
        title: Sessions by state
        query: sum by (state) (pg_stat_activity_count{namespace="workload", job="kubernetes-pods", datname="postgres"})
        unit: count
        stack: true
        series:
          label: "{{state}}"

      - type: line
        title: Locks by mode
        query: sum by (mode) (pg_locks_count{namespace="workload", job="kubernetes-pods", datname="postgres"})
        unit: count
        stack: true
        series:
          label: "{{mode}}"
          top: 5
          rank_by: max

  # Lists that are short or empty when the database is healthy.
  - title: Needs attention
    elements:
      - type: list
        title: Sessions waiting
        description: Active sessions blocked on something other than CPU, by what they wait for.
        query: sum by (wait_event_type) (pg_stat_activity_count{namespace="workload", job="kubernetes-pods", state="active", wait_event_type!=""}) > 0
        unit: count
        label: "{{wait_event_type}}"
        limit: 10
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }
            - { at: 5, level: critical }

      - type: list
        title: Dead tuples by table
        description: Rows awaiting vacuum. A table that keeps climbing is outrunning autovacuum.
        query: topk(10, pg_stat_user_tables_n_dead_tup{namespace="workload", job="kubernetes-pods"} > 0)
        unit: count
        label: "{{schemaname}}.{{relname}}"
        limit: 10
        sparkline: true

      - type: list
        title: Sequential scans (1h)
        description: Full table scans in the last hour. A high count on a large table suggests a missing index.
        query: topk(10, round(increase(pg_stat_user_tables_seq_scan{namespace="workload", job="kubernetes-pods"}[1h])) > 0)
        unit: count
        label: "{{schemaname}}.{{relname}}"
        limit: 10
        sparkline: true
