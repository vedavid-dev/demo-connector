version: 1
id: service-latency
title: Service latency
sections:
  - title: Overview
    elements:
      - type: stat
        title: Requests per second
        query: sum(rate(http_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: requests_per_sec
      - type: stat
        title: Error rate
        query: 100 * sum(rate(http_requests_total{namespace="workload", job="kubernetes-pods", status=~"5.."}[5m])) / sum(rate(http_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: percent
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }
            - { at: 5, level: critical }
      - type: stat
        title: p95 latency
        query: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000
        unit: milliseconds
        thresholds:
          direction: above
          steps:
            - { at: 500, level: warning }
            - { at: 1000, level: critical }
      - type: stat
        title: Cache hit rate
        query: 100 * sum(rate(cache_requests_total{namespace="workload", job="kubernetes-pods", result="hit"}[5m])) / sum(rate(cache_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: percent
        decimals: 0
  - title: Latency
    elements:
      - type: line
        title: Latency quantiles
        query: label_replace(histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "quantile", "p50", "", "") or label_replace(histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "quantile", "p95", "", "") or label_replace(histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "quantile", "p99", "", "")
        unit: milliseconds
        series:
          label: "{{quantile}}"
      - type: line
        title: p95 latency by hop
        description: Where a request spends its time, from the HTTP frontend through the gRPC call to the database query.
        query: label_replace(histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "hop", "frontend", "", "") or label_replace(histogram_quantile(0.95, sum by (le) (rate(grpc_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "hop", "quotation", "", "") or label_replace(histogram_quantile(0.95, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "hop", "postgres", "", "")
        unit: milliseconds
        series:
          label: "{{hop}}"
      - type: line
        title: Requests slower than one second
        query: 100 * (1 - sum(rate(http_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods", le="1"}[5m])) / sum(rate(http_request_duration_seconds_count{namespace="workload", job="kubernetes-pods"}[5m])))
        unit: percent
  - title: Traffic
    elements:
      - type: line
        title: Requests per second by hop
        description: Quotation calls match frontend requests; database queries are only the cache misses.
        query: label_replace(sum(rate(http_requests_total{namespace="workload", job="kubernetes-pods"}[5m])), "hop", "frontend", "", "") or label_replace(sum(rate(grpc_requests_total{namespace="workload", job="kubernetes-pods"}[5m])), "hop", "quotation", "", "") or label_replace(sum(rate(postgres_query_duration_seconds_count{namespace="workload", job="kubernetes-pods"}[5m])), "hop", "postgres", "", "")
        unit: requests_per_sec
        series:
          label: "{{hop}}"
      - type: line
        title: Requests per second by pod
        query: sum by (pod) (rate(http_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: requests_per_sec
        series:
          label: "{{pod}}"
  - title: Errors
    elements:
      - type: line
        title: Errors per second by status
        query: sum by (status) (rate(http_requests_total{namespace="workload", job="kubernetes-pods", status=~"5.."}[5m]))
        unit: requests_per_sec
        series:
          label: "{{status}}"
