version: 1
id: cluster-overview
title: Cluster health

sections:
  - title: Health
    elements:
      - type: stat
        title: Nodes not ready
        description: Nodes whose Ready condition is false or unknown.
        query: sum(kube_node_status_condition{condition="Ready",status!="true"}) or vector(0)
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 1, level: critical }

      - type: stat
        title: Pods unhealthy
        description: Pods in Pending, Failed or Unknown phase.
        query: sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) or vector(0)
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }
            - { at: 5, level: critical }

      - type: stat
        title: CPU used
        query: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))
        unit: percent
        decimals: 0
        thresholds:
          direction: above
          steps:
            - { at: 70, level: warning }
            - { at: 90, level: critical }

      - type: stat
        title: Memory used
        query: 100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))
        unit: percent
        decimals: 0
        thresholds:
          direction: above
          steps:
            - { at: 80, level: warning }
            - { at: 95, level: critical }

      - type: stat
        title: Restarts (1h)
        description: Container restarts across the cluster in the last hour.
        query: round(sum(increase(kube_pod_container_status_restarts_total[1h]))) or vector(0)
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }
            - { at: 10, level: critical }

      - type: stat
        title: Disk used
        description: Fullest root filesystem across all nodes.
        query: >-
          100 * max(1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})
        unit: percent
        decimals: 0
        thresholds:
          direction: above
          steps:
            - { at: 80, level: warning }
            - { at: 90, level: critical }

  # Lists that are empty when the cluster is healthy.
  - title: Needs attention
    elements:
      - type: list
        title: Restarting containers
        description: Containers that restarted in the last hour.
        query: round(increase(kube_pod_container_status_restarts_total[1h])) > 0
        unit: count
        label: "{{namespace}}/{{pod}}"
        limit: 10
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }
            - { at: 5, level: critical }

      - type: list
        title: Containers waiting
        description: Containers stuck waiting, e.g. CrashLoopBackOff or ImagePullBackOff.
        query: sum by (namespace, pod, reason) (kube_pod_container_status_waiting_reason) > 0
        unit: count
        label: "{{pod}} · {{reason}}"
        limit: 10

      - type: list
        title: Deployments short of replicas
        query: (kube_deployment_spec_replicas - kube_deployment_status_replicas_available) > 0
        unit: count
        label: "{{namespace}}/{{deployment}}"
        limit: 10
        thresholds:
          direction: above
          steps:
            - { at: 1, level: warning }

  - title: Resources
    elements:
      - type: line
        title: CPU by namespace
        query: sum by (namespace) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
        unit: cores
        stack: true
        series:
          label: "{{namespace}}"
          top: 5
          rank_by: mean

      - type: line
        title: Memory by namespace
        query: sum by (namespace) (container_memory_working_set_bytes{container!="",image!=""})
        unit: bytes
        stack: true
        series:
          label: "{{namespace}}"
          top: 5
          rank_by: mean

      - type: line
        title: Network traffic
        description: Node network throughput, excluding loopback and pod interfaces.
        query: >-
          label_replace(sum(rate(node_network_receive_bytes_total{device!~"lo|veth.*|cni.*|flannel.*"}[5m])), "direction", "in", "", "")
          or
          label_replace(sum(rate(node_network_transmit_bytes_total{device!~"lo|veth.*|cni.*|flannel.*"}[5m])), "direction", "out", "", "")
        unit: bytes_per_sec
        series:
          label: "{{direction}}"
          
  - title: Top pods
    elements:
      - type: list
        title: Memory
        query: topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!="",image!=""}))
        unit: bytes
        label: "{{namespace}}/{{pod}}"
        limit: 10
        sparkline: true
        
      - type: list
        title: CPU
        query: topk(10, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m])))
        unit: cores
        label: "{{namespace}}/{{pod}}"
        limit: 10
        sparkline: true
