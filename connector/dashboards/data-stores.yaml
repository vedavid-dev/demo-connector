version: 1
id: data-stores
title: Data stores
sections:
  - title: Redis
    elements:
      - type: stat
        title: Cache hit rate
        query: 100 * sum(rate(cache_requests_total{namespace="workload", job="kubernetes-pods", result="hit"}[5m])) / sum(rate(cache_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: percent
        decimals: 0
        thresholds:
          direction: below
          steps:
            - { at: 50, level: warning }
      - type: stat
        title: Keys
        query: sum(redis_db_keys{namespace="workload", job="kubernetes-pods"})
        unit: count
      - type: stat
        title: Memory
        query: sum(redis_memory_used_bytes{namespace="workload", job="kubernetes-pods"})
        unit: bytes
      - type: stat
        title: Clients
        query: sum(redis_connected_clients{namespace="workload", job="kubernetes-pods"})
        unit: count
      - type: line
        title: Cache lookups by result
        query: sum by (result) (rate(cache_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: ops_per_sec
        stack: true
        series:
          label: "{{result}}"
      - type: line
        title: Commands per second
        query: sum(rate(redis_commands_processed_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: ops_per_sec
  - title: Postgres
    elements:
      - type: stat
        title: Connections
        query: sum(pg_stat_database_numbackends{namespace="workload", job="kubernetes-pods", datname="postgres"})
        unit: count
        thresholds:
          direction: above
          steps:
            - { at: 50, level: warning }
            - { at: 90, level: critical }
      - type: stat
        title: p95 query time
        query: histogram_quantile(0.95, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000
        unit: milliseconds
        thresholds:
          direction: above
          steps:
            - { at: 100, level: warning }
            - { at: 500, level: critical }
      - type: stat
        title: Cache hit ratio
        description: Blocks served from Postgres' shared buffers rather than disk.
        query: 100 * sum(rate(pg_stat_database_blks_hit{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])) / (sum(rate(pg_stat_database_blks_hit{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])) + sum(rate(pg_stat_database_blks_read{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])))
        unit: percent
        decimals: 0
      - type: line
        title: Queries per second
        description: Every query is a cache miss in Redis.
        query: sum(rate(postgres_query_duration_seconds_count{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: ops_per_sec
      - type: line
        title: Transactions per second
        query: label_replace(sum(rate(pg_stat_database_xact_commit{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])), "outcome", "commit", "", "") or label_replace(sum(rate(pg_stat_database_xact_rollback{namespace="workload", job="kubernetes-pods", datname="postgres"}[5m])), "outcome", "rollback", "", "")
        unit: ops_per_sec
        series:
          label: "{{outcome}}"
      - type: line
        title: Connections by state
        query: sum by (state) (pg_stat_activity_count{namespace="workload", job="kubernetes-pods", datname="postgres"})
        unit: count
        stack: true
        series:
          label: "{{state}}"
