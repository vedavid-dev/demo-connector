apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: connector
  namespace: vedavid
spec:
  interval: 15m
  # The token secret arrives by hand, so the first install may find it missing.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vedavid-connector
      # The chart's appVersion picks the image, and a tag stamps both. One line.
      version: "0.5.1"
      sourceRef:
        kind: HelmRepository
        name: connector
        namespace: flux-system
  values:
    clusterLabel: demo-k3s
    prometheus:
      url: http://prometheus-server.monitoring.svc.cluster.local
    dashboards:
      sources:
        - configMap: vedavid-dashboards-k8s
        - configMap: vedavid-dashboards-postgres
        - configMap: vedavid-dashboards-redis
        - configMap: vedavid-dashboards-rust-k8s-demo
