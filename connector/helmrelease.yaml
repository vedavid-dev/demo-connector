apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: connector
  namespace: vedavid
spec:
  interval: 15m
  chart:
    spec:
      chart: vedavid-connector
      # The chart's appVersion picks the image, and a tag stamps both. One line.
      version: "0.5.0"
      sourceRef:
        kind: HelmRepository
        name: connector
        namespace: flux-system
  values:
    clusterLabel: demo-k3s
    prometheus:
      url: http://prometheus-server.monitoring.svc.cluster.local
    dashboards:
      sources:
        - configMap: vedavid-dashboards
