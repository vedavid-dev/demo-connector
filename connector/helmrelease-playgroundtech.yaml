# A second tenant on the same cluster. A connector serves one organisation, so
# playgroundtech.io gets its own, reading the same Prometheus and dashboards.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: connector-playgroundtech
  namespace: vedavid
spec:
  interval: 15m
  # The token secret arrives by hand, so the first install may find it missing.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vedavid-connector
      version: "0.5.1"
      sourceRef:
        kind: HelmRepository
        name: connector
        namespace: flux-system
  values:
    clusterLabel: demo-k3s
    enrolment:
      secretName: vedavid-enrolment-token-playgroundtech
    prometheus:
      url: http://prometheus-server.monitoring.svc.cluster.local
    dashboards:
      sources:
        - configMap: vedavid-dashboards-k8s
        - configMap: vedavid-dashboards-postgres
        - configMap: vedavid-dashboards-redis
        - configMap: vedavid-dashboards-rust-k8s-demo
